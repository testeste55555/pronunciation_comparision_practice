name: Deploy static app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript modules
        run: |
          node --check site/assets/anatomy.js
          node --check site/assets/data.js
          node --check site/assets/mouth.js
          node --check site/assets/teacher.js
          node --check site/assets/learner.js
          node --test tests/model.test.mjs

      - name: Fetch pinned CC0 reference assets
        run: bash ./scripts/fetch_reference_assets.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
