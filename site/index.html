<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="教師提示用・発音比較口腔図アプリ MVP">
  <title>発音比較・口腔図アプリ｜教師用</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="teacher-app">
    <header class="teacher-header">
      <div>
        <h1>発音比較・口腔図アプリ</h1>
        <div class="version" id="versionLabel">教師用操作画面</div>
      </div>
      <div class="header-actions">
        <button type="button" class="secondary-button" id="openLearnerButton">学習者画面を開く</button>
        <button type="button" class="secondary-button lock-button" id="lockButton">投影をロック</button>
        <button type="button" class="danger-button" id="blankButton">即時に無地</button>
      </div>
    </header>

    <main class="teacher-main">
      <section class="panel left-column" aria-labelledby="settingsTitle">
        <h2 class="panel-title" id="settingsTitle">比較設定</h2>
        <div class="panel-body">
          <div class="field">
            <label for="profileSelect">比較候補プロファイル</label>
            <select id="profileSelect"></select>
          </div>

          <div class="field">
            <span class="field-label">対象音</span>
            <div class="sound-tabs" id="soundTabs"></div>
          </div>

          <div class="field">
            <span class="field-label">再生速度</span>
            <div class="speed-tabs" id="speedTabs"></div>
          </div>

          <div class="notice" id="profileWarning"></div>

          <div class="info-section">
            <h3>日本語モデル</h3>
            <dl class="info-grid" id="japaneseInfo"></dl>
          </div>

          <div class="info-section">
            <h3>比較候補モデル</h3>
            <dl class="info-grid" id="candidateInfo"></dl>
          </div>

          <div class="info-section">
            <h3>教師向け指導ポイント</h3>
            <ul id="coachingList"></ul>
          </div>

          <div class="status-row">
            <span class="badge warning" id="statusBadge"></span>
            <span class="badge" id="confidenceBadge"></span>
          </div>
        </div>
      </section>

      <section class="panel stage-panel" aria-labelledby="stageTitle">
        <h2 class="panel-title" id="stageTitle">教師用確認図</h2>
        <div class="teacher-stage">
          <div class="mouth-stage" id="teacherMouth"></div>
        </div>
        <div class="teacher-controls">
          <div class="scene-grid" id="sceneGrid"></div>
        </div>
      </section>

      <div class="right-column">
        <section class="panel" aria-labelledby="previewTitle">
          <h2 class="panel-title" id="previewTitle">学習者画面プレビュー</h2>
          <div class="panel-body">
            <div class="preview-wrap">
              <iframe class="preview-frame" id="previewFrame" src="learner.html?preview=1" title="学習者画面プレビュー"></iframe>
            </div>
            <div class="preview-status" id="previewStatus">表示：無地</div>
          </div>
        </section>

        <section class="panel" aria-labelledby="safetyTitle">
          <h2 class="panel-title" id="safetyTitle">投影・データ安全</h2>
          <div class="panel-body">
            <div class="notice">
              教師用情報は同期データに含めません。学習者画面には文字、IPA、専門用語、言語名、操作部品を表示しません。
            </div>
            <div class="info-section">
              <h3>現在の実装状態</h3>
              <ul>
                <li>口腔運動：UI確認用の暫定モデル</li>
                <li>母語モデル：比較候補としてのみ使用</li>
                <li>音声：未登録。模範音として使用不可</li>
                <li>自動採点：未実装</li>
              </ul>
            </div>
            <div class="info-section">
              <h3>簡略モデルについて</h3>
              <div class="notice" id="modelNote"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="assets/teacher.js"></script>
</body>
</html>
